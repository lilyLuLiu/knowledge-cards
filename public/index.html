<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识卡片 · 每日复习</title>
<style>
:root {
  --bg: #f5f6fa; --card-bg: #ffffff; --primary: #6c5ce7; --primary-light: #a29bfe;
  --primary-dark: #5a4bd1; --text: #2d3436; --text-light: #636e72; --border: #dfe6e9;
  --success: #00b894; --danger: #e17055; --warning: #fdcb6e;
  --shadow: 0 4px 20px rgba(108,92,231,0.1); --shadow-hover: 0 8px 30px rgba(108,92,231,0.2);
  --radius: 16px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; transition:background 0.3s; }
body.dark { --bg:#1a1a2e; --card-bg:#16213e; --primary:#a29bfe; --primary-light:#6c5ce7; --primary-dark:#a29bfe; --text:#f5f6fa; --text-light:#b2bec3; --border:#2d3436; --shadow:0 4px 20px rgba(0,0,0,0.3); --shadow-hover:0 8px 30px rgba(0,0,0,0.4); }

/* Login */
.login-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg); z-index:5000; align-items:center; justify-content:center; }
.login-overlay.show { display:flex; }
.login-box { background:var(--card-bg); padding:40px; border-radius:24px; box-shadow:var(--shadow); width:90%; max-width:380px; text-align:center; }
.login-icon { font-size:48px; margin-bottom:16px; }
.login-title { font-size:24px; font-weight:700; margin-bottom:8px; color:var(--primary); }
.login-subtitle { font-size:14px; color:var(--text-light); margin-bottom:24px; }
.login-input { width:100%; padding:12px 16px; border:2px solid var(--border); border-radius:12px; font-size:16px; background:var(--bg); color:var(--text); margin-bottom:16px; }
.login-input:focus { outline:none; border-color:var(--primary); }
.login-btn { width:100%; padding:12px; border:none; border-radius:12px; background:var(--primary); color:#fff; font-size:16px; font-weight:600; cursor:pointer; transition:all 0.2s; }
.login-btn:hover { background:var(--primary-dark); }
.login-error { color:var(--danger); font-size:14px; margin-top:12px; min-height:20px; }

/* Header */
.header { background:var(--card-bg); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; box-shadow:var(--shadow); position:sticky; top:0; z-index:100; }
.logo { display:flex; align-items:center; gap:10px; font-size:22px; font-weight:700; color:var(--primary); }
.logo-icon { font-size:28px; }
.header-actions { display:flex; gap:12px; align-items:center; }
.btn-icon { width:40px; height:40px; border:none; border-radius:50%; background:var(--bg); color:var(--text); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
.btn-icon:hover { background:var(--primary); color:#fff; transform:scale(1.05); }

/* Stats */
.stats-bar { display:flex; gap:12px; padding:20px 24px; flex-wrap:wrap; }
.stat-card { background:var(--card-bg); padding:16px 24px; border-radius:var(--radius); box-shadow:var(--shadow); text-align:center; min-width:120px; flex:1; }
.stat-number { font-size:28px; font-weight:700; color:var(--primary); }
.stat-label { font-size:13px; color:var(--text-light); margin-top:4px; }

/* Tabs */
.tabs { display:flex; gap:8px; padding:0 24px 16px; overflow-x:auto; flex-wrap:wrap; }
.tab { padding:8px 20px; border-radius:30px; border:2px solid var(--border); background:var(--card-bg); color:var(--text-light); cursor:pointer; font-size:14px; font-weight:600; transition:all 0.2s; white-space:nowrap; display:flex; align-items:center; gap:6px; }
.tab:hover { border-color:var(--primary-light); }
.tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.tab-count { background:rgba(0,0,0,0.1); padding:1px 8px; border-radius:20px; font-size:12px; }
.tab.active .tab-count { background:rgba(255,255,255,0.3); }

/* Buttons */
.btn { padding:10px 24px; border:none; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer; transition:all 0.2s; display:inline-flex; align-items:center; gap:8px; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:var(--primary-dark); transform:translateY(-1px); box-shadow:var(--shadow-hover); }
.btn-outline { background:transparent; border:2px solid var(--primary); color:var(--primary); }
.btn-outline:hover { background:var(--primary); color:#fff; }
.btn-sm { padding:6px 14px; font-size:13px; }

/* Main */
.main-content { padding:0 24px 80px; }
.action-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:12px; }
.section-title { font-size:20px; font-weight:700; }

/* Display Filter Bar */
.display-filter-bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.filter-group { display:flex; align-items:center; gap:6px; }
.filter-label { font-size:13px; color:var(--text-light); font-weight:600; white-space:nowrap; }
.filter-pills { display:flex; gap:4px; }
.filter-pill { padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--card-bg); color:var(--text-light); transition:all 0.2s; white-space:nowrap; }
.filter-pill:hover { border-color:var(--primary); color:var(--primary); }
.filter-pill.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.filter-divider { width:1px; height:20px; background:var(--border); }

/* Cards */
.card-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px; }
.knowledge-card { background:var(--card-bg); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); transition:all 0.3s; border-left:4px solid var(--primary); position:relative; }
.knowledge-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-hover); }
.knowledge-card.cat-english { border-left-color:#e17055; }
.knowledge-card.cat-programming { border-left-color:#0984e3; }
.knowledge-card.cat-math { border-left-color:#00b894; }
.knowledge-card.cat-science { border-left-color:#fd79a8; }
.knowledge-card.cat-history { border-left-color:#fdcb6e; }
.knowledge-card.cat-language { border-left-color:#6c5ce7; }
.knowledge-card.cat-other { border-left-color:#636e72; }
.card-category { display:inline-block; padding:3px 12px; border-radius:20px; font-size:12px; font-weight:600; margin-bottom:10px; color:#fff; }
.cat-english .card-category { background:#e17055; }
.cat-programming .card-category { background:#0984e3; }
.cat-math .card-category { background:#00b894; }
.cat-science .card-category { background:#fd79a8; }
.cat-history .card-category { background:#fdcb6e; color:#2d3436; }
.cat-language .card-category { background:#6c5ce7; }
.cat-other .card-category { background:#636e72; }
.card-title { font-size:17px; font-weight:700; margin-bottom:8px; line-height:1.4; }
.card-content { font-size:14px; color:var(--text-light); line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.card-footer { display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:12px; border-top:1px solid var(--border); }
.card-date { font-size:12px; color:var(--text-light); }
.card-actions { display:flex; gap:8px; }
.card-btn { width:32px; height:32px; border:none; border-radius:8px; background:var(--bg); color:var(--text-light); cursor:pointer; font-size:14px; transition:all 0.2s; display:flex; align-items:center; justify-content:center; }
.card-btn:hover { background:var(--primary); color:#fff; }
.speak-btn:hover { background:var(--success); color:#fff; }
.speak-btn.playing { background:var(--success); color:#fff; animation:pulse 0.6s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.15);} }
.flashcard-speak { position:absolute; top:16px; right:16px; width:40px; height:40px; border:none; border-radius:50%; background:rgba(255,255,255,0.2); color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; z-index:5; }
.flashcard-speak:hover { background:rgba(255,255,255,0.4); transform:scale(1.1); }
.flashcard-speak.playing { background:rgba(255,255,255,0.5); animation:pulse 0.6s infinite; }
.mastered-btn { color:var(--text-light); }
.mastered-btn.active { background:var(--success); color:#fff; }
.knowledge-card.mastered { background:#f0eef7; }
.knowledge-card.mastered .card-title { color:#9c95b8; }
.knowledge-card.mastered .card-content { color:#b0a8c5; }
.knowledge-card.mastered .card-date { color:#c4bdd5; }
.knowledge-card.mastered .card-category { opacity:0.45; }
body.dark .knowledge-card.mastered { background:#1e1d35; }
body.dark .knowledge-card.mastered .card-title { color:#6a6580; }
body.dark .knowledge-card.mastered .card-content { color:#555070; }
body.dark .knowledge-card.mastered .card-date { color:#4a4565; }
.mastered-badge { position:absolute; top:12px; right:12px; background:var(--success); color:#fff; font-size:10px; padding:2px 8px; border-radius:20px; font-weight:600; }
.flashcard-mastered-tag { padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600; margin-bottom:0; color:#fff; background:rgba(0,184,148,0.8); }
.review-nav-btn.mastered-toggle { background:var(--card-bg); color:var(--text); box-shadow:var(--shadow); font-size:13px; }
.review-nav-btn.mastered-toggle.active { background:var(--success); color:#fff; }
.card-btn.delete:hover { background:var(--danger); }
.review-badge { position:absolute; top:12px; right:12px; background:var(--success); color:#fff; font-size:10px; padding:2px 8px; border-radius:20px; font-weight:600; }

/* Modal */
.modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center; padding:20px; }
.modal-overlay.show { display:flex; }
.modal { background:var(--card-bg); border-radius:var(--radius); padding:28px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
.modal-title { font-size:22px; font-weight:700; margin-bottom:20px; }
.form-group { margin-bottom:16px; }
.form-label { display:block; font-size:14px; font-weight:600; margin-bottom:6px; color:var(--text); }
.form-input, .form-textarea, .form-select { width:100%; padding:10px 14px; border:2px solid var(--border); border-radius:10px; font-size:15px; background:var(--bg); color:var(--text); font-family:inherit; transition:border-color 0.2s; }
.form-input:focus, .form-textarea:focus, .form-select:focus { outline:none; border-color:var(--primary); }
.form-textarea { min-height:100px; resize:vertical; }
.modal-actions { display:flex; gap:12px; justify-content:flex-end; margin-top:20px; }
.category-input-group { display:flex; gap:8px; }
.category-input-group .form-input { flex:1; }

/* Review */
.review-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg); z-index:999; flex-direction:column; }
.review-overlay.show { display:flex; }
.review-header { padding:20px 24px; display:flex; justify-content:space-between; align-items:center; background:var(--card-bg); box-shadow:var(--shadow); }
.review-progress { font-size:16px; font-weight:600; color:var(--text-light); }
.review-progress span { color:var(--primary); font-size:20px; }
.review-close { width:40px; height:40px; border:none; border-radius:50%; background:var(--bg); color:var(--text); font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
.review-close:hover { background:var(--danger); color:#fff; }
.review-body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; overflow-y:auto; }
.flashcard { width:100%; max-width:640px; min-height:320px; perspective:1500px; cursor:pointer; margin-bottom:24px; }
.flashcard-inner { width:100%; height:100%; min-height:320px; position:relative; transition:transform 0.6s; transform-style:preserve-3d; }
.flashcard.flipped .flashcard-inner { transform:rotateY(180deg); }
.flashcard-front, .flashcard-back { position:absolute; top:0; left:0; width:100%; min-height:320px; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:24px; padding:36px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; box-shadow:var(--shadow); }
.flashcard-front { background:var(--card-bg); border:2px solid var(--primary-light); }
.flashcard-back { background:linear-gradient(135deg, var(--primary), var(--primary-light)); color:#fff; transform:rotateY(180deg); }
.flashcard-category { padding:4px 16px; border-radius:20px; font-size:12px; font-weight:600; margin-bottom:20px; color:#fff; }
.flashcard-label { font-size:13px; color:var(--text-light); text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; }
.flashcard-back .flashcard-label { color:rgba(255,255,255,0.7); }
.flashcard-title { font-size:26px; font-weight:700; line-height:1.4; margin-bottom:16px; }
.flashcard-content { font-size:17px; line-height:1.7; white-space:pre-wrap; word-break:break-word; }
.flashcard-hint { font-size:13px; color:var(--text-light); margin-top:20px; }
.flashcard-back .flashcard-hint { color:rgba(255,255,255,0.6); }
.review-controls { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
.review-nav-btn { padding:12px 32px; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; gap:8px; }
.review-nav-btn.skip { background:var(--card-bg); color:var(--text); box-shadow:var(--shadow); }
.review-nav-btn.skip:hover { transform:translateY(-2px); }
.review-nav-btn.next { background:var(--primary); color:#fff; }
.review-nav-btn.next:hover { background:var(--primary-dark); transform:translateY(-2px); }
.review-nav-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; }

/* Review Settings */
.review-settings { margin-bottom:8px; }
.category-checkboxes { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.cat-checkbox { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:20px; border:2px solid var(--border); background:var(--bg); color:var(--text-light); cursor:pointer; font-size:14px; font-weight:600; transition:all 0.2s; user-select:none; }
.cat-checkbox:hover { border-color:var(--primary-light); }
.cat-checkbox.checked { background:var(--primary); color:#fff; border-color:var(--primary); }
.cat-checkbox .cat-dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
.review-count-input { width:80px; padding:8px 12px; border:2px solid var(--border); border-radius:10px; font-size:15px; background:var(--bg); color:var(--text); text-align:center; }
.review-count-input:focus { outline:none; border-color:var(--primary); }
.order-options { display:flex; gap:8px; margin-top:8px; }
.order-option { flex:1; padding:10px; border:2px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text-light); cursor:pointer; font-size:14px; font-weight:600; text-align:center; transition:all 0.2s; }
.order-option:hover { border-color:var(--primary-light); }
.order-option.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.settings-summary { font-size:13px; color:var(--text-light); margin-top:12px; padding:10px 14px; background:var(--bg); border-radius:10px; }
.settings-summary b { color:var(--primary); }

/* Misc */
.cat-manage-item { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-radius:10px; background:var(--bg); margin-bottom:8px; }
.cat-manage-info { display:flex; align-items:center; gap:10px; }
.cat-manage-dot { width:14px; height:14px; border-radius:50%; flex-shrink:0; }
.cat-manage-name { font-size:15px; font-weight:600; }
.cat-manage-count { font-size:13px; color:var(--text-light); }
.cat-manage-delete { width:32px; height:32px; border:none; border-radius:8px; background:transparent; color:var(--text-light); cursor:pointer; font-size:16px; transition:all 0.2s; }
.cat-manage-delete:hover { background:var(--danger); color:#fff; }
.cat-manage-tag { font-size:11px; padding:2px 8px; border-radius:10px; background:var(--border); color:var(--text-light); }
.empty-state { text-align:center; padding:60px 20px; color:var(--text-light); }
.empty-state-icon { font-size:64px; margin-bottom:16px; }
.empty-state-text { font-size:18px; margin-bottom:20px; }
.review-complete { text-align:center; padding:40px 20px; }
.review-complete-icon { font-size:72px; margin-bottom:16px; }
.review-complete-title { font-size:28px; font-weight:700; margin-bottom:8px; }
.review-complete-text { font-size:16px; color:var(--text-light); margin-bottom:24px; }

/* Recall Mode */
.recall-card { background:var(--card-bg); border-radius:var(--radius); padding:32px; box-shadow:var(--shadow); max-width:600px; width:100%; margin:0 auto; position:relative; border:2px solid var(--primary-light); }
.recall-category { display:inline-block; padding:4px 14px; border-radius:20px; font-size:13px; font-weight:600; color:#fff; margin-bottom:20px; }
.recall-label { font-size:13px; color:var(--text-light); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
.recall-answer { font-size:18px; line-height:1.7; color:var(--text); white-space:pre-wrap; word-break:break-word; padding:16px; background:var(--bg); border-radius:12px; margin-bottom:24px; }
.recall-input { width:100%; min-height:100px; padding:14px; border:2px solid var(--border); border-radius:12px; font-size:16px; background:var(--bg); color:var(--text); font-family:inherit; resize:vertical; transition:border-color 0.2s; box-sizing:border-box; }
.recall-input:focus { outline:none; border-color:var(--primary); }
.recall-input:disabled { opacity:0.7; }
.recall-result { margin-top:20px; padding:16px; border-radius:12px; animation:fadeIn 0.3s; }
.recall-result.correct { background:rgba(0,184,148,0.12); border:1px solid var(--success); }
.recall-result.wrong { background:rgba(225,112,85,0.10); border:1px solid var(--danger); }
.recall-result-title { font-size:15px; font-weight:700; margin-bottom:8px; }
.recall-result.correct .recall-result-title { color:var(--success); }
.recall-result.wrong .recall-result-title { color:var(--danger); }
.recall-correct-answer { font-size:15px; color:var(--text); line-height:1.6; }
.recall-correct-answer b { color:var(--primary); }
.recall-actions { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
.recall-speak { position:absolute; top:16px; right:16px; width:40px; height:40px; border:none; border-radius:50%; background:var(--bg); color:var(--text-light); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
.recall-speak:hover { background:var(--success); color:#fff; }
.recall-speak.playing { background:var(--success); color:#fff; animation:pulse 0.6s infinite; }
.dictation-audio-area { text-align:center; padding:24px 16px; margin-bottom:20px; background:var(--bg); border-radius:16px; }
.dictation-icon { font-size:48px; margin-bottom:8px; }
.dictation-hint { font-size:14px; color:var(--text-light); margin-bottom:16px; }
.dictation-play-btn { padding:12px 32px; border:none; border-radius:30px; background:var(--success); color:#fff; font-size:16px; font-weight:600; cursor:pointer; transition:all 0.2s; }
.dictation-play-btn:hover { opacity:0.85; transform:scale(1.03); }
.dictation-play-btn.playing { animation:pulse 0.6s infinite; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
.sync-indicator { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text-light); padding:4px 12px; background:var(--bg); border-radius:20px; }
.sync-dot { width:8px; height:8px; border-radius:50%; background:var(--success); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
.toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:var(--text); color:var(--card-bg); padding:12px 28px; border-radius:30px; font-size:14px; font-weight:600; z-index:2000; transition:transform 0.3s; box-shadow:0 4px 20px rgba(0,0,0,0.3); }
.toast.show { transform:translateX(-50%) translateY(0); }
.loading-overlay { display:flex; position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg); z-index:3000; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
.loading-overlay.hidden { display:none; }
.loading-spinner { width:48px; height:48px; border:4px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
.knowledge-card { animation:fadeIn 0.3s ease; }

@media (max-width:600px) {
  .header { padding:12px 16px; } .stats-bar { padding:16px; gap:8px; }
  .stat-card { min-width:90px; padding:12px; } .stat-number { font-size:22px; }
  .tabs, .main-content { padding-left:16px; padding-right:16px; }
  .flashcard-title { font-size:20px; } .flashcard-content { font-size:15px; }
  .sync-indicator { display:none; }
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div style="color:var(--text-light);font-size:15px;">正在加载...</div>
</div>

<!-- Login -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-icon">🧠</div>
    <div class="login-title">知识卡片</div>
    <div class="login-subtitle">请输入密码以继续</div>
    <input type="password" class="login-input" id="loginPassword" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()">

<script>
const defaultCategories = { english:{name:'英语',color:'#e17055'}, programming:{name:'编程',color:'#0984e3'}, math:{name:'数学',color:'#00b894'}, science:{name:'科学',color:'#fd79a8'}, history:{name:'历史',color:'#fdcb6e'}, language:{name:'语言',color:'#6c5ce7'}, other:{name:'其他',color:'#636e72'} };
let cards=[], customCategories={}, reviewLogs={}, streak={count:0,lastDate:null}, deletedDefaults=[];
let currentFilter='all', editingId=null, reviewQueue=[], reviewIndex=0;
let displayMasteredFilter='all', sortMode='desc';
let reviewMode='flip';

function getToken() { return localStorage.getItem('kc_token') || ''; }
function setToken(t) { if(t) localStorage.setItem('kc_token', t); else localStorage.removeItem('kc_token'); }

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch('/api' + path, opts);
  if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
  if (!res.ok) throw new Error('API error');
  return res.json();
}

function showLogin() {
  document.getElementById('loadingOverlay').classList.add('hidden');
  document.getElementById('loginOverlay').classList.add('show');
  setTimeout(() => document.getElementById('loginPassword').focus(), 100);
}

async function doLogin() {
  const pwd = document.getElementById('loginPassword').value;
  if (!pwd) { document.getElementById('loginError').textContent = '请输入密码'; return; }
  try {
    const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({password: pwd}) });
    const data = await res.json();
    if (data.success) {
      setToken(data.token || pwd);
      document.getElementById('loginOverlay').classList.remove('show');
      document.getElementById('loginError').textContent = '';
      document.getElementById('loginPassword').value = '';
      init();
    } else {
      document.getElementById('loginError').textContent = data.error || '密码错误';
    }
  } catch (e) { document.getElementById('loginError').textContent = '连接失败'; }
}

async function init() {
  loadTheme();
  try {
    const state = await api('GET', '/state');
    cards = state.cards || []; customCategories = state.customCategories || {};
    reviewLogs = state.reviewLogs || {}; streak = state.streak || {count:0,lastDate:null};
    deletedDefaults = state.deletedDefaults || [];
    document.getElementById('loadingOverlay').classList.add('hidden');
    renderTabs(); renderCards(); updateStats();
  } catch (e) { if (e.message === 'unauthorized') return; showToast('加载失败'); document.getElementById('loadingOverlay').classList.add('hidden'); }
}

function loadTheme() {
  const theme = localStorage.getItem('kc_theme') || 'light';
  if (theme === 'dark') { document.body.classList.add('dark'); document.getElementById('themeBtn').textContent = '☀️'; }
}
function toggleTheme() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('kc_theme', isDark ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
}
function getCategoryInfo(k) { return defaultCategories[k] || customCategories[k] || {name:k,color:'#636e72'}; }

/* ===== 语音发音 ===== */
let synth = window.speechSynthesis || null;
if (synth) synth.onvoiceschanged = () => synth.getVoices();
function speak(text, isEnglish, btn) {
  if (!synth) { showToast('当前浏览器不支持语音播放'); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (isEnglish) {
    u.lang = 'en-US';
    u.rate = 0.85;
    const voices = synth.getVoices();
    const enVoice = voices.find(v => v.lang.startsWith('en'));
    if (enVoice) u.voice = enVoice;
  } else {
    u.lang = 'zh-CN';
    u.rate = 1.0;
    const voices = synth.getVoices();
    const zhVoice = voices.find(v => v.lang.startsWith('zh'));
    if (zhVoice) u.voice = zhVoice;
  }
  document.querySelectorAll('.speak-btn.playing,.flashcard-speak.playing').forEach(b => b.classList.remove('playing'));
  if (btn) btn.classList.add('playing');
  u.onend = u.onerror = () => { document.querySelectorAll('.speak-btn.playing,.flashcard-speak.playing').forEach(b => b.classList.remove('playing')); };
  synth.speak(u);
}
function speakCard(id, btn) {
  const card = cards.find(c => c.id === id);
  if (!card) return;
  const isEnglish = card.category === 'english';
  speak(card.title + '. ' + card.content, isEnglish, btn);
}
function speakReviewCard(field, btn) {
  const card = reviewQueue[reviewIndex];
  if (!card) return;
  const isEnglish = card.category === 'english';
  speak(card[field] || '', isEnglish, btn);
}
function getAllCategories() {
  const result = {};
  Object.keys(defaultCategories).forEach(k => { if (!deletedDefaults.includes(k)) result[k] = defaultCategories[k]; });
  Object.keys(customCategories).forEach(k => { result[k] = customCategories[k]; });
  return result;
}

function renderTabs() {
  const allCats = getAllCategories(); const counts = {};
  cards.forEach(c => { counts[c.category] = (counts[c.category]||0)+1; });
  let html = `<div class="tab ${currentFilter==='all'?'active':''}" onclick="filterCards('all')">📚 全部 <span class="tab-count">${cards.length}</span></div>`;
  [...new Set([...Object.keys(allCats), ...Object.keys(counts)])].forEach(key => {
    const info = allCats[key]; if (!info) return;
    const count = counts[key]||0; if (count===0 && !defaultCategories[key]) return;
    html += `<div class="tab ${currentFilter===key?'active':''}" onclick="filterCards('${key}')">${escapeHtml(info.name)} <span class="tab-count">${count}</span></div>`;
  });
  document.getElementById('categoryTabs').innerHTML = html;
}
function filterCards(cat) { currentFilter=cat; renderTabs(); renderCards(); }

function setDisplayFilter(mode) {
  displayMasteredFilter = mode;
  document.querySelectorAll('[data-mastered-filter]').forEach(el => el.classList.toggle('active', el.dataset.masteredFilter === mode));
  renderCards();
}

function setSortOrder(mode) {
  sortMode = mode;
  document.querySelectorAll('[data-sort-order]').forEach(el => el.classList.toggle('active', el.dataset.sortOrder === mode));
  renderCards();
}

function renderCards() {
  const grid = document.getElementById('cardGrid'), empty = document.getElementById('emptyState');
  const allCats = getAllCategories();
  document.getElementById('sectionTitle').textContent = currentFilter==='all' ? '全部卡片' : (allCats[currentFilter]?.name || '卡片');
  let filtered = currentFilter==='all' ? cards : cards.filter(c => c.category===currentFilter);
  if (displayMasteredFilter === 'mastered') filtered = filtered.filter(c => c.mastered);
  else if (displayMasteredFilter === 'unmastered') filtered = filtered.filter(c => !c.mastered);
  filtered.sort((a,b) => sortMode==='desc' ? b.createdAt-a.createdAt : a.createdAt-b.createdAt);
  if (filtered.length===0) { grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  const todayLog = getTodayReviewLog();
  grid.innerHTML = filtered.map(card => {
    const info = getCategoryInfo(card.category);
    const isMastered = !!card.mastered;
    return `<div class="knowledge-card ${isMastered?'mastered':''}" style="border-left-color:${info.color}">
      ${todayLog.includes(card.id) ? '<div class="review-badge">✓ 今日已复习</div>' : ''}
      ${isMastered ? '<div class="mastered-badge">✅ 已学会</div>' : ''}
      <span class="card-category" style="background:${info.color}">${escapeHtml(info.name)}</span>
      <div class="card-title">${escapeHtml(card.title)}</div>
      <div class="card-content">${escapeHtml(card.content)}</div>
      <div class="card-footer"><div class="card-date">${formatDate(card.createdAt)}</div>
      <div class="card-actions"><button class="card-btn speak-btn" onclick="speakCard(${card.id}, this)" title="发音">🔊</button><button class="card-btn mastered-btn ${isMastered?'active':''}" onclick="toggleMastered(${card.id})" title="${isMastered?'取消已学会':'标记已学会'}">${isMastered?'✅':'⬜'}</button><button class="card-btn" onclick="editCard(${card.id})">✏️</button><button class="card-btn delete" onclick="deleteCard(${card.id})">🗑️</button></div></div>
    </div>`;
  }).join('');
}

function updateStats() {
  document.getElementById('totalCards').textContent = cards.length;
  document.getElementById('todayReview').textContent = getTodayReviewLog().length;
  document.getElementById('masteredCount').textContent = cards.filter(c => c.mastered).length;
  document.getElementById('streakDays').textContent = streak.count || 0;
}
function getTodayReviewLog() { return reviewLogs[new Date().toDateString()] || []; }

function openAddModal() {
  editingId=null;
  document.getElementById('modalTitle').textContent='添加卡片';
  renderCategorySelect(currentFilter==='all' ? 'english' : currentFilter);
  document.getElementById('customCategory').value=''; document.getElementById('cardTitle').value=''; document.getElementById('cardContent').value='';
  document.getElementById('addModal').classList.add('show');
  setTimeout(() => document.getElementById('cardTitle').focus(), 100);
}
function editCard(id) {
  const card = cards.find(c=>c.id===id); if(!card) return; editingId=id;
  document.getElementById('modalTitle').textContent='编辑卡片';
  const allCats = getAllCategories();
  const selectVal = allCats[card.category] ? card.category : 'other';
  renderCategorySelect(selectVal);
  document.getElementById('customCategory').value = allCats[card.category] ? '' : card.category;
  document.getElementById('cardTitle').value=card.title; document.getElementById('cardContent').value=card.content;
  document.getElementById('addModal').classList.add('show');
}
function renderCategorySelect(selectedVal) {
  const allCats = getAllCategories();
  const select = document.getElementById('cardCategory');
  select.innerHTML = Object.keys(allCats).map(k =>
    `<option value="${k}" ${k===selectedVal?'selected':''}>${escapeHtml(allCats[k].name)}</option>`
  ).join('');
}

async function saveCard() {
  let category = document.getElementById('cardCategory').value;
  const customCat = document.getElementById('customCategory').value.trim();
  if (customCat) {
    const key = customCat.toLowerCase().replace(/\s+/g,'_').replace(/[^\w\u4e00-\u9fa5]/g,'');
    if (!defaultCategories[key] && !customCategories[key]) {
      const colors = ['#00cec9','#55efc4','#a29bfe','#ffeaa7','#74b9ff','#e84393','#d63031','#6ab04c','#be2edd','#f0932b'];
      customCategories[key] = { name:customCat, color:colors[Object.keys(customCategories).length%colors.length] };
      await api('POST','/categories',{key,name:customCat,color:customCategories[key].color});
    }
    category = key;
  }
  const title = document.getElementById('cardTitle').value.trim();
  const content = document.getElementById('cardContent').value.trim();
  if (!title) { showToast('请输入标题'); return; }
  if (!content) { showToast('请输入内容'); return; }
  try {
    if (editingId) {
      await api('PUT','/cards/'+editingId,{category,title,content});
      const card = cards.find(c=>c.id===editingId);
      if (card) { card.category=category; card.title=title; card.content=content; }
      showToast('卡片已更新');
    } else {
      const newCard = await api('POST','/cards',{category,title,content});
      cards.push(newCard);
      showToast('卡片已添加');
    }
    closeModal(); renderTabs(); renderCards(); updateStats();
  } catch(e) { showToast('保存失败'); }
}

async function deleteCard(id) {
  if (!confirm('确定删除这张卡片吗？')) return;
  try { await api('DELETE','/cards/'+id); cards=cards.filter(c=>c.id!==id); renderTabs(); renderCards(); updateStats(); showToast('卡片已删除'); }
  catch(e) { showToast('删除失败'); }
}
async function toggleMastered(id) {
  const card = cards.find(c => c.id === id);
  if (!card) return;
  try {
    const res = await api('PATCH','/cards/'+id+'/mastered',{});
    card.mastered = res.mastered;
    renderCards();
    showToast(card.mastered ? '✅ 已标记为学会' : '已取消学会标记');
  } catch(e) { showToast('操作失败'); }
}
async function toggleMasteredReview() {
  const card = reviewQueue[reviewIndex];
  if (!card) return;
  try {
    const res = await api('PATCH','/cards/'+card.id+'/mastered',{});
    card.mastered = res.mastered;
    renderReviewCard();
    showToast(card.mastered ? '✅ 已标记为学会' : '已取消学会标记');
  } catch(e) { showToast('操作失败'); }
}
function closeModal() { document.getElementById('addModal').classList.remove('show'); editingId=null; }

// ===== 分类管理 =====
function openCategoryModal() {
  document.getElementById('newCatName').value = '';
  renderCategoryManageList();
  renderDeletedDefaults();
  document.getElementById('categoryModal').classList.add('show');
}
function closeCategoryModal() { document.getElementById('categoryModal').classList.remove('show'); }

function renderCategoryManageList() {
  const allCats = getAllCategories();
  const counts = {};
  cards.forEach(c => { counts[c.category] = (counts[c.category]||0)+1; });
  const container = document.getElementById('categoryManageList');
  let html = '';
  Object.keys(allCats).forEach(key => {
    const info = allCats[key];
    const count = counts[key] || 0;
    const isDefault = !!defaultCategories[key];
    html += `<div class="cat-manage-item">
      <div class="cat-manage-info">
        <span class="cat-manage-dot" style="background:${info.color}"></span>
        <span class="cat-manage-name">${escapeHtml(info.name)}</span>
        ${isDefault ? '<span class="cat-manage-tag">默认</span>' : '<span class="cat-manage-tag">自定义</span>'}
        <span class="cat-manage-count">${count} 张卡片</span>
      </div>
      ${key === 'other' && deletedDefaults.length === 0 && Object.keys(customCategories).length === 0 ? '<span style="font-size:11px;color:var(--text-light);">至少保留一个分类</span>' : `<button class="cat-manage-delete" onclick="deleteCategory('${key}')" title="删除">🗑️</button>`}
    </div>`;
  });
  container.innerHTML = html;
}

function renderDeletedDefaults() {
  const section = document.getElementById('deletedDefaultsSection');
  if (deletedDefaults.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  const list = document.getElementById('deletedDefaultsList');
  list.innerHTML = deletedDefaults.map(k => {
    const info = defaultCategories[k];
    return `<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:var(--bg);margin:4px;font-size:13px;"><span class="cat-manage-dot" style="background:${info.color}"></span>${escapeHtml(info.name)}</span>`;
  }).join('');
}

async function addCategoryFromModal() {
  const name = document.getElementById('newCatName').value.trim();
  if (!name) { showToast('请输入分类名称'); return; }
  const key = name.toLowerCase().replace(/\s+/g,'_').replace(/[^\w\u4e00-\u9fa5]/g,'');
  if (!key) { showToast('分类名称无效'); return; }
  const allCats = getAllCategories();
  if (allCats[key]) { showToast('该分类已存在'); return; }
  const colors = ['#00cec9','#55efc4','#a29bfe','#ffeaa7','#74b9ff','#e84393','#d63031','#6ab04c','#be2edd','#f0932b'];
  const color = colors[Object.keys(customCategories).length % colors.length];
  customCategories[key] = { name, color };
  try {
    await api('POST','/categories',{key,name,color});
    document.getElementById('newCatName').value = '';
    renderCategoryManageList();
    renderTabs();
    showToast('分类已添加');
  } catch(e) { showToast('添加失败'); }
}

async function deleteCategory(key) {
  const allCats = getAllCategories();
  const info = allCats[key];
  const counts = {};
  cards.forEach(c => { counts[c.category] = (counts[c.category]||0)+1; });
  const count = counts[key] || 0;
  const msg = count > 0
    ? `确定删除分类「${info.name}」吗？该分类下 ${count} 张卡片将移至其他分类。`
    : `确定删除分类「${info.name}」吗？`;
  if (!confirm(msg)) return;
  try {
    const res = await api('DELETE','/categories/'+encodeURIComponent(key));
    if (res.cards) cards = res.cards;
    if (res.customCategories) customCategories = res.customCategories;
    if (res.deletedDefaults) deletedDefaults = res.deletedDefaults;
    else deletedDefaults = deletedDefaults.filter(d => d !== key);
    if (currentFilter === key) currentFilter = 'all';
    renderCategoryManageList();
    renderDeletedDefaults();
    renderTabs(); renderCards(); updateStats();
    showToast('分类已删除');
  } catch(e) { showToast('删除失败'); }
}

async function restoreDefaults() {
  try {
    await api('POST','/categories/restore');
    deletedDefaults = [];
    renderCategoryManageList();
    renderDeletedDefaults();
    renderTabs(); renderCards();
    showToast('默认分类已恢复');
  } catch(e) { showToast('恢复失败'); }
}

let reviewSelectedCats = new Set();
let reviewOrder = 'random';
let reviewMasteredFilter = 'all';

function openReviewSettings() {
  if (cards.length === 0) { showToast('没有卡片可复习'); return; }
  // 默认选中英语分类
  reviewSelectedCats = new Set();
  reviewSelectedCats.add('english');
  // 确保英语分类存在卡片，否则回退全选
  if (!cards.some(c => c.category === 'english')) {
    Object.keys(getAllCategories()).forEach(k => {
      if (cards.some(c => c.category === k)) reviewSelectedCats.add(k);
    });
  }
  reviewOrder = 'random';
  document.querySelector('#orderOptions .order-option.active')?.classList.remove('active');
  document.querySelector('#orderOptions .order-option[data-order="random"]').classList.add('active');
  reviewMode = 'flip';
  document.querySelector('#reviewModeOptions .order-option.active')?.classList.remove('active');
  document.querySelector('#reviewModeOptions .order-option[data-rmode="flip"]').classList.add('active');
  document.getElementById('reviewModeHint').textContent = '翻卡模式：看问题，点击翻转看答案';
  reviewMasteredFilter = 'unmastered';
  document.querySelector('#masteredOptions .order-option.active')?.classList.remove('active');
  document.querySelector('#masteredOptions .order-option[data-mastered="unmastered"]').classList.add('active');
  document.getElementById('reviewCount').value = 10;
  renderReviewCategoryCheckboxes();
  updateReviewSummary();
  document.getElementById('reviewSettingsModal').classList.add('show');
}

function renderReviewCategoryCheckboxes() {
  const container = document.getElementById('reviewCategoryCheckboxes');
  const allCats = getAllCategories();
  const counts = {};
  cards.forEach(c => { counts[c.category] = (counts[c.category]||0)+1; });
  let html = '';
  // 全选选项
  const totalCats = [...new Set(cards.map(c=>c.category))].length;
  const allSelected = reviewSelectedCats.size === totalCats;
  html += `<div class="cat-checkbox ${allSelected?'checked':''}" onclick="toggleReviewCategory('__all__')"><span class="cat-dot" style="background:var(--primary)"></span>全选</div>`;
  [...new Set([...Object.keys(allCats), ...Object.keys(counts)])].forEach(key => {
    const info = allCats[key]; if (!info) return;
    const count = counts[key]||0; if (count===0 && !defaultCategories[key]) return;
    const checked = reviewSelectedCats.has(key);
    html += `<div class="cat-checkbox ${checked?'checked':''}" onclick="toggleReviewCategory('${key}')"><span class="cat-dot" style="background:${info.color}"></span>${escapeHtml(info.name)} (${count})</div>`;
  });
  container.innerHTML = html;
}

function toggleReviewCategory(key) {
  if (key === '__all__') {
    const totalCats = [...new Set(cards.map(c=>c.category))];
    if (reviewSelectedCats.size === totalCats.length) {
      reviewSelectedCats.clear();
    } else {
      reviewSelectedCats = new Set(totalCats);
    }
  } else {
    if (reviewSelectedCats.has(key)) reviewSelectedCats.delete(key);
    else reviewSelectedCats.add(key);
  }
  renderReviewCategoryCheckboxes();
  updateReviewSummary();
}

function selectOrder(order) {
  reviewOrder = order;
  document.querySelectorAll('#orderOptions .order-option').forEach(el => el.classList.remove('active'));
  document.querySelector(`#orderOptions .order-option[data-order="${order}"]`).classList.add('active');
  updateReviewSummary();
}

function selectReviewMode(mode) {
  reviewMode = mode;
  document.querySelectorAll('#reviewModeOptions .order-option').forEach(el => el.classList.remove('active'));
  document.querySelector(`#reviewModeOptions .order-option[data-rmode="${mode}"]`).classList.add('active');
  const hint = document.getElementById('reviewModeHint');
  if (mode === 'flip') hint.textContent = '翻卡模式：看问题，点击翻转看答案';
  else if (mode === 'recall') hint.textContent = '默写模式：看答案，手写知识点，提交后对比';
  else hint.textContent = '听写模式：仅听发音，写出知识点，提交后对比';
  updateReviewSummary();
}

function selectMasteredFilter(filter) {
  reviewMasteredFilter = filter;
  document.querySelectorAll('#masteredOptions .order-option').forEach(el => el.classList.remove('active'));
  document.querySelector(`#masteredOptions .order-option[data-mastered="${filter}"]`).classList.add('active');
  updateReviewSummary();
}

function updateReviewSummary() {
  const pool = getReviewPool();
  const countInput = document.getElementById('reviewCount').value;
  const maxCount = parseInt(countInput) || 0;
  const willReview = maxCount > 0 ? Math.min(maxCount, pool.length) : pool.length;
  const orderText = reviewOrder === 'random' ? '随机' : reviewOrder === 'sequential' ? '顺序（新→旧）' : '倒序（旧→新）';
  const masteredText = reviewMasteredFilter === 'all' ? '全部' : reviewMasteredFilter === 'mastered' ? '仅已学会' : '仅未学会';
  const modeText = reviewMode === 'flip' ? '翻卡' : reviewMode === 'recall' ? '默写' : '听写';
  const summary = document.getElementById('reviewSummary');
  if (reviewSelectedCats.size === 0) {
    summary.innerHTML = '⚠️ 请至少选择一个分类';
  } else {
    summary.innerHTML = `模式：<b>${modeText}</b>，已选 <b>${reviewSelectedCats.size}</b> 个分类，筛选：<b>${masteredText}</b>，可用卡片 <b>${pool.length}</b> 张，本次复习 <b>${willReview}</b> 张，顺序：<b>${orderText}</b>`;
  }
}

function getReviewPool() {
  const todayLog = getTodayReviewLog();
  const masteredFilter = (c) => {
    if (reviewMasteredFilter === 'mastered') return !!c.mastered;
    if (reviewMasteredFilter === 'unmastered') return !c.mastered;
    return true;
  };
  let pool = cards.filter(c => reviewSelectedCats.has(c.category) && masteredFilter(c) && !todayLog.includes(c.id));
  if (pool.length === 0) {
    pool = cards.filter(c => reviewSelectedCats.has(c.category) && masteredFilter(c));
  }
  return pool;
}

function closeReviewSettings() {
  document.getElementById('reviewSettingsModal').classList.remove('show');
}

function confirmReview() {
  if (reviewSelectedCats.size === 0) { showToast('请至少选择一个分类'); return; }
  let pool = getReviewPool();
  if (pool.length === 0) { showToast('选中分类没有可复习的卡片'); return; }
  const countInput = document.getElementById('reviewCount').value;
  const maxCount = parseInt(countInput) || 0;
  // 排序
  if (reviewOrder === 'random') {
    reviewQueue = shuffle([...pool]);
  } else if (reviewOrder === 'sequential') {
    reviewQueue = [...pool].sort((a,b) => b.createdAt - a.createdAt);
  } else {
    reviewQueue = [...pool].sort((a,b) => a.createdAt - b.createdAt);
  }
  // 限制数量
  if (maxCount > 0 && reviewQueue.length > maxCount) {
    reviewQueue = reviewQueue.slice(0, maxCount);
  }
  if (reviewQueue.length === 0) { showToast('没有卡片可复习'); return; }
  reviewIndex = 0;
  document.getElementById('reviewTotal').textContent = reviewQueue.length;
  closeReviewSettings();
  document.getElementById('reviewOverlay').classList.add('show');
  renderReviewCard();
}

function startReview() { openReviewSettings(); }

function getExportCards() {

    pool = [...pool].sort((a,b) => b.createdAt - a.createdAt);

}

function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function renderReviewCard() {
  const body = document.getElementById('reviewBody');
  document.getElementById('reviewIndex').textContent = reviewIndex+1;
  if (reviewIndex >= reviewQueue.length) {
    body.innerHTML = `<div class="review-complete"><div class="review-complete-icon">🎉</div><div class="review-complete-title">复习完成！</div><div class="review-complete-text">本轮复习了 ${reviewQueue.length} 张卡片，继续保持！</div><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;"><button class="btn btn-outline" onclick="exitReview()">返回</button><button class="btn btn-primary" onclick="startReview()">再来一轮</button></div></div>`;
    updateStats(); renderCards(); return;
  }
  if (reviewMode === 'recall') { renderRecallCard(); return; }
  if (reviewMode === 'dictation') { renderDictationCard(); return; }
  const card = reviewQueue[reviewIndex], info = getCategoryInfo(card.category);
  const isMastered = !!card.mastered;
  body.innerHTML = `<div class="flashcard" id="flashcard" onclick="flipCard()"><div class="flashcard-inner">
    <div class="flashcard-front"><span class="flashcard-category" style="background:${info.color}">${escapeHtml(info.name)}</span>${isMastered?'<span class="flashcard-mastered-tag">✅ 已学会</span>':''}<button class="flashcard-speak" onclick="event.stopPropagation();speakReviewCard('title',this)" title="发音">🔊</button><div class="flashcard-label">问题</div><div class="flashcard-title">${escapeHtml(card.title)}</div><div class="flashcard-hint">👆 点击卡片查看答案</div></div>
    <div class="flashcard-back"><span class="flashcard-category" style="background:rgba(255,255,255,0.25)">${escapeHtml(info.name)}</span><button class="flashcard-speak" onclick="event.stopPropagation();speakReviewCard('content',this)" title="发音">🔊</button><div class="flashcard-label">答案</div><div class="flashcard-content">${escapeHtml(card.content)}</div><div class="flashcard-hint">👆 点击返回问题</div></div>

function submitRecall() {
  const card = reviewQueue[reviewIndex];
  const input = document.getElementById('recallInput');
  if (!input) return;
  const userInput = input.value.trim();
  const correctAnswer = card.title.trim();

  // 简单的相似度判断

  const isCorrect = similarity >= 1.0;
  resultDiv.innerHTML = `<div class="recall-result ${isCorrect?'correct':'wrong'}">

}

function submitDictation() {
  const card = reviewQueue[reviewIndex];
  const input = document.getElementById('dictationInput');
  if (!input) return;
  const userInput = input.value.trim();
  const correctAnswer = card.title.trim();
  const resultDiv = document.getElementById('dictationResult');
  if (!userInput) { showToast('请先写出答案再提交'); return; }
  const similarity = calcSimilarity(userInput.toLowerCase(), correctAnswer.toLowerCase());
  const isCorrect = similarity >= 1.0;
  resultDiv.innerHTML = `<div class="recall-result ${isCorrect?'correct':'wrong'}">
    <div class="recall-result-title">${isCorrect?'✅ 回答正确！':'❌ 回答错误'}</div>

  </div>`;
  input.disabled = true;
  resultDiv.scrollIntoView({ behavior:'smooth', block:'nearest' });

function calcSimilarity(a, b) {
  if (a === b) return 1;
  if (!a || !b) return 0;
  // 基于编辑距离的相似度
  const longer = a.length > b.length ? a : b;
  const shorter = a.length > b.length ? b : a;
  const dist = editDistance(shorter, longer);
  return (longer.length - dist) / longer.length;
}
function editDistance(s1, s2) {
  const m = s1.length, n = s2.length;
  const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for (let i=0;i<=m;i++) dp[i][0]=i;
  for (let j=0;j<=n;j++) dp[0][j]=j;
  for (let i=1;i<=m;i++) for (let j=1;j<=n;j++)
    dp[i][j] = s1[i-1]===s2[j-1] ? dp[i-1][j-1] : Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1])+1;
  return dp[m][n];
}
async function nextCard() {

function formatDate(ts) { const d=new Date(ts),n=new Date(),diff=n-d; if(diff<60000)return'刚刚'; if(diff<3600000)return Math.floor(diff/60000)+'分钟前'; if(diff<86400000)return Math.floor(diff/3600000)+'小时前'; if(diff<604800000)return Math.floor(diff/86400000)+'天前'; return `${d.getMonth()+1}月${d.getDate()}日`; }
function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

document.addEventListener('keydown', (e) => {
  if (e.key==='Escape') {
    if (document.getElementById('reviewOverlay').classList.contains('show')) exitReview();
    else if (document.getElementById('reviewSettingsModal').classList.contains('show')) closeReviewSettings();
    else if (document.getElementById('exportModal').classList.contains('show')) closeExportModal();
    else if (document.getElementById('categoryModal').classList.contains('show')) closeCategoryModal();
    else if (document.getElementById('addModal').classList.contains('show')) closeModal();
  }
  if (document.getElementById('reviewOverlay').classList.contains('show') && reviewMode === 'flip') {
    if (e.key===' '||e.key==='Enter') { e.preventDefault(); flipCard(); }
    else if (e.key==='ArrowRight') nextCard();
    else if (e.key==='ArrowLeft') prevCard();
    else if (e.key==='s'||e.key==='S') { e.preventDefault(); const flipped=document.getElementById('flashcard')&&document.getElementById('flashcard').classList.contains('flipped'); speakReviewCard(flipped?'content':'title'); }
  }
});

init();
